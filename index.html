document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"7dbf3f40-f713-4cce-88f0-0c0953a24e1a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"04fca9a7-280f-48ab-9a30-12d7280bf933\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Outfit';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"7dbf3f40-f713-4cce-88f0-0c0953a24e1a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --bg: #f4ede0;\n    --bg-2: #ece3d2;\n    --bg-deep: #2b2620;\n    --paper: #faf5ea;\n    --ink: #28221c;\n    --ink-soft: #5a5048;\n    --ink-mute: #8b8076;\n    --line: #d9cdb6;\n    --sage: #6e7f63;\n    --sage-deep: #4f5e46;\n    --terra: #b1684a;\n  --terra-soft: #e8b59e;\n  --mustard: #d9a443;\n  --sky: #8ca9c1;\n    --shadow: 0 1px 2px rgba(40,30,20,.04), 0 12px 40px -16px rgba(40,30,20,.18);\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    background: var(--bg);\n    color: var(--ink);\n    font-family: \"Outfit\", \"Helvetica Neue\", sans-serif;\n    font-weight: 400;\n    font-size: 17px;\n    line-height: 1.55;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n  .serif { font-family: \"Instrument Serif\", \"Times New Roman\", serif; font-weight: 400; letter-spacing: -0.005em; }\n  .italic { font-style: italic; }\n  .mono-label {\n    font-family: \"Outfit\", sans-serif;\n    text-transform: uppercase;\n    letter-spacing: 0.18em;\n    font-size: 11px;\n    font-weight: 500;\n    color: var(--ink-mute);\n  }\n  a { color: inherit; text-decoration: none; }\n  img { display: block; max-width: 100%; }\n  .container { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 32px; }\n\n  /* ---------- NAV ---------- */\n  .nav {\n    position: sticky; top: 0; z-index: 50;\n    backdrop-filter: blur(14px);\n    background: rgba(244, 237, 224, 0.78);\n    border-bottom: 1px solid rgba(217, 205, 182, 0.5);\n  }\n  .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }\n  .brand { display: flex; align-items: baseline; gap: 10px; padding-left: 24px; }\n  .brand .mark { font-family: \"Instrument Serif\", serif; font-size: 22px; font-style: italic; line-height: 1; }\n  .brand .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--sage); display: inline-block; margin: 0 2px 2px; vertical-align: middle; }\n  .brand .role { font-size: 12px; color: var(--ink-mute); letter-spacing: 0.04em; }\n  .nav-links { display: flex; gap: 28px; font-size: 14px; color: var(--ink-soft); }\n  .nav-links a { transition: color .2s; }\n  .nav-links a:hover { color: var(--ink); }\n  .nav-cta {\n    background: var(--sage-deep); color: var(--paper);\n    padding: 10px 18px; border-radius: 999px;\n    font-size: 13px; letter-spacing: 0.02em;\n    transition: all .2s;\n    display: inline-flex; align-items: center; gap: 6px;\n    box-shadow: 0 6px 18px -8px rgba(79, 94, 70, 0.6);\n    margin-right: 24px;\n  }\n  .nav-cta:hover { background: var(--terra); transform: translateY(-1px) rotate(-1deg); }\n  @media (max-width: 1040px) { .nav-links { display: none; } }\n\n  /* ---------- HERO ---------- */\n  .hero { padding: 48px 0 72px; position: relative; overflow: hidden; }\n  .hero-grid {\n    display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 56px; align-items: center;\n  }\n  .hero h1 {\n    font-family: \"Instrument Serif\", serif;\n    font-weight: 400;\n    font-size: clamp(48px, 7vw, 96px);\n    line-height: 1.02;\n    letter-spacing: -0.015em;\n    margin: 18px 0 24px;\n    color: var(--ink);\n  }\n  .hero h1 .em {\n    font-style: italic; color: var(--sage-deep);\n    position: relative; display: inline-block;\n  }\n  .hero h1 .em::after {\n    content: \"\"; position: absolute;\n    left: 0; right: 0; bottom: -8px; height: 12px;\n    background: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 12' preserveAspectRatio='none'><path d='M2 8 Q 25 2, 50 6 T 100 6 T 150 6 T 198 6' fill='none' stroke='%23b1684a' stroke-width='2.2' stroke-linecap='round'/><\u002Fsvg>\") no-repeat center / 100% 100%;\n  }\n  .hero-sub {\n    font-size: 19px; color: var(--ink-soft); max-width: 480px;\n    line-height: 1.5;\n  }\n  .hero-meta {\n    margin-top: 36px; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center;\n  }\n  .hero-meta .item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-soft); }\n  .hero-meta .item svg { width: 16px; height: 16px; stroke: var(--sage-deep); }\n  .hero-ctas { margin-top: 36px; display: flex; gap: 14px; flex-wrap: wrap; }\n  .btn {\n    display: inline-flex; align-items: center; gap: 10px;\n    padding: 16px 26px;\n    border-radius: 999px;\n    font-size: 15px; font-weight: 500;\n    transition: all .2s ease;\n    cursor: pointer;\n    border: 1px solid transparent;\n  }\n  .btn-primary {\n    background: var(--sage-deep); color: var(--paper);\n    padding: 18px 28px 18px 30px;\n    border-radius: 999px;\n    font-size: 16px;\n    box-shadow: 0 1px 0 var(--sage-deep), 0 8px 22px -10px rgba(79, 94, 70, 0.55);\n    position: relative;\n  }\n  .btn-primary::before {\n    content: \"\"; position: absolute; inset: 5px;\n    border: 1px dashed rgba(250, 245, 234, 0.35);\n    border-radius: 999px;\n    pointer-events: none;\n  }\n  .btn-primary:hover { background: var(--terra); transform: translateY(-2px) rotate(-1deg); box-shadow: 0 1px 0 var(--terra), 0 14px 28px -10px rgba(177, 104, 74, 0.55); }\n  .btn-primary .arrow { transition: transform .25s ease; }\n  .btn-primary:hover .arrow { transform: translateX(4px); }\n  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }\n  .btn-ghost:hover { border-color: var(--ink); }\n  .btn .arrow { width: 18px; height: 18px; }\n\n  /* portrait */\n  .portrait-wrap { position: relative; aspect-ratio: 4/5; }\n  .portrait {\n    width: 100%; height: 100%; object-fit: cover;\n    border-radius: 280px 280px 24px 24px;\n    filter: saturate(1.02) contrast(1.02);\n  }\n  .portrait-frame {\n    position: absolute; inset: 0;\n    border-radius: 280px 280px 24px 24px;\n    box-shadow: var(--shadow);\n    pointer-events: none;\n  }\n  .portrait-badge {\n    position: absolute; left: -28px; bottom: 36px;\n    background: var(--paper);\n    border: 1px solid var(--line);\n    border-radius: 999px;\n    padding: 10px 16px;\n    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;\n    color: var(--ink-soft);\n    box-shadow: var(--shadow);\n    display: flex; align-items: center; gap: 8px;\n    transform: rotate(-4deg);\n  }\n  .portrait-badge .pulse {\n    width: 8px; height: 8px; border-radius: 50%; background: #6fa97a;\n    box-shadow: 0 0 0 0 rgba(111, 169, 122, .6);\n    animation: pulse 2s infinite;\n  }\n  @keyframes pulse {\n    0% { box-shadow: 0 0 0 0 rgba(111, 169, 122, .55); }\n    70% { box-shadow: 0 0 0 10px rgba(111, 169, 122, 0); }\n    100% { box-shadow: 0 0 0 0 rgba(111, 169, 122, 0); }\n  }\n  .portrait-card {\n    position: absolute; right: 0; top: calc(100% + 14px);\n    background: var(--paper);\n    border: 1px solid var(--line);\n    border-radius: 18px;\n    padding: 14px 16px;\n    font-size: 13px; color: var(--ink-soft);\n    width: 230px;\n    box-shadow: var(--shadow);\n    transform: rotate(3deg);\n    z-index: 2;\n  }\n  .portrait-card .title { font-family: \"Instrument Serif\", serif; font-size: 22px; color: var(--ink); display: block; margin-bottom: 4px; line-height: 1.1; }\n\n  .hero-flower {\n    position: absolute;\n    width: 90px;\n    pointer-events: none;\n    animation: spin 22s linear infinite;\n  }\n  .hero-flower.hf1 { top: 60px; left: 46%; opacity: 0.85; }\n  .hero-flower.hf2 { bottom: 90px; right: 42%; width: 60px; opacity: 0.7; animation-direction: reverse; }\n\n  @media (max-width: 820px) {\n    .hero-grid { grid-template-columns: 1fr; gap: 48px; }\n    .portrait-card, .portrait-badge { display: none; }\n  }\n\n  /* ---------- TOPICS BAND (replaces ribbon) ---------- */\n  .topics-band { padding: 40px 0 56px; position: relative; }\n  .topics-band .intro {\n    text-align: center; max-width: 540px; margin: 0 auto 28px;\n    font-family: \"Instrument Serif\", serif; font-style: italic;\n    font-size: 24px; color: var(--ink-soft); line-height: 1.3;\n  }\n  .topics-band .intro em { font-style: normal; color: var(--sage-deep); }\n  .chips-cloud {\n    display: flex; flex-wrap: wrap; justify-content: center;\n    gap: 12px 14px; max-width: 880px; margin: 0 auto;\n  }\n  .cloud-chip {\n    background: var(--paper);\n    border: 1px solid var(--line);\n    border-radius: 999px;\n    padding: 10px 18px 11px;\n    font-size: 15px;\n    color: var(--ink);\n    display: inline-flex; align-items: center; gap: 8px;\n    transition: transform .25s ease, background .25s ease, color .25s ease;\n    cursor: default;\n  }\n  .cloud-chip:nth-child(2n) { transform: rotate(-1.5deg); }\n  .cloud-chip:nth-child(3n) { transform: rotate(2deg); }\n  .cloud-chip:nth-child(5n) { transform: rotate(-0.5deg); }\n  .cloud-chip:hover { background: var(--sage-deep); color: var(--paper); border-color: var(--sage-deep); transform: rotate(0) translateY(-2px); }\n  .cloud-chip .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }\n  .cloud-chip:hover .dot { background: var(--terra-soft) !important; }\n  @keyframes scroll {\n    from { transform: translateX(0); }\n    to { transform: translateX(-50%); }\n  }\n\n  /* ---------- SECTION base ---------- */\n  section { padding: 96px 0; position: relative; }\n  .sec-head { margin-bottom: 56px; max-width: 760px; }\n  .sec-head .eyebrow { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 18px; }\n  .sec-head .eyebrow::before { content: \"\"; width: 22px; height: 1px; background: var(--sage); display: inline-block; }\n  .sec-head h2 {\n    font-family: \"Instrument Serif\", serif;\n    font-weight: 400;\n    font-size: clamp(38px, 4.8vw, 60px);\n    line-height: 1.05;\n    letter-spacing: -0.01em;\n    margin: 0 0 16px;\n  }\n  .sec-head h2 .em { font-style: italic; color: var(--sage-deep); }\n  .sec-head p { font-size: 18px; color: var(--ink-soft); max-width: 620px; }\n\n  /* ---------- ABOUT ---------- */\n  .about { background: var(--paper); }\n  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }\n  .about-collage {\n    position: relative; aspect-ratio: 4/5; max-width: 460px;\n  }\n  .sticker {\n    position: absolute;\n    background: var(--paper);\n    border: 1px solid var(--line);\n    border-radius: 18px;\n    box-shadow: var(--shadow);\n  }\n  .sticker.quote-big {\n    top: 8%; left: 4%;\n    width: 78%;\n    padding: 30px 28px 28px;\n    transform: rotate(-3deg);\n    background: var(--bg-deep); color: var(--paper);\n    border-color: var(--bg-deep);\n  }\n  .sticker.quote-big p {\n    font-family: \"Instrument Serif\", serif; font-style: italic;\n    font-size: 26px; line-height: 1.2; margin: 0;\n  }\n  .sticker.quote-big .mark-q {\n    font-family: \"Instrument Serif\", serif; font-size: 70px; line-height: 0.2; color: var(--terra); display: block; ma span class=\"eyebrow\"><span class=\"mono-label\">Sobre mí<\u002Fspan><\u002Fspan>\n          <h2>Hola, soy <span class=\"em\">Gabriela<\u002Fspan>.<\u002Fh2>\n        <\u002Fdiv>\n        <p>Como psicóloga clínica, mi objetivo es <strong>guiarte en el proceso de comprender y modificar patrones de comportamiento que te generan sufrimiento<\u002Fstrong>. Juntxs trabajaremos para desarrollar habilidades que te permitan enfrentar los desafíos de la vida con mayor flexibilidad.<\u002Fp>\n        <p>Mi forma de trabajar durante las sesiones es a través de la <strong>práctica y tareas fuera de sesión<\u002Fstrong>, tanto en terapia individual como de pareja. Vamos a practicar habilidades y a incomodarnos juntxs a favor de mejorar tu bienestar.<\u002Fp>\n        <div class=\"about-signature\">\n          Gabriela Barrozo\n          <small>Lic. en Psicología · UAGRM · ella / she<\u002Fsmall>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ENFOQUE -->\n<section id=\"enfoque\" data-screen-label=\"03 Enfoque\">\n  <div class=\"container\">\n    <div class=\"sec-head\">\n      <span class=\"eyebrow\"><span class=\"mono-label\">Enfoque<\u002Fspan><\u002Fspan>\n      <h2>Terapia <span class=\"em\">conductual–contextual<\u002Fspan>, basada en evidencia.<\u002Fh2>\n      <p>Trabajo desde modelos de tercera generación: ACT, FAP y TCC. La terapia hablada por sí sola no alcanza — practicamos, nos movemos y construimos cambios reales.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"approach-grid\">\n      <div class=\"approach-card\">\n        <svg class=\"flower\" viewBox=\"0 0 100 100\" aria-hidden=\"true\">\n          <g transform=\"translate(50 50)\">\n            <ellipse cx=\"0\" cy=\"-22\" rx=\"12\" ry=\"22\" fill=\"#e8b59e\" transform=\"rotate(0)\"><\u002Fellipse>\n            <ellipse cx=\"0\" cy=\"-22\" rx=\"12\" ry=\"22\" fill=\"#e8b59e\" transform=\"rotate(60)\"><\u002Fellipse>\n            <ellipse cx=\"0\" cy=\"-22\" rx=\"12\" p>\n    <\u002Fdiv>\n    <div class=\"topics-grid\">\n      <div class=\"topic\"><span class=\"topic-num\">01<\u002Fspan><div class=\"topic-title\">Ansiedad social<small>Miedo a ser juzgadx, exposición<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"topic\"><span class=\"topic-num\">02<\u002Fspan><div class=\"topic-title\">Manejo de preocupaciones<small>Rumia y pensamientos repetitivos<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"topic\"><span class=\"topic-num\">03<\u002Fspan><div class=\"topic-title\">Habilidades sociales<small>Asertividad y conexión genuina<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"topic\"><span class=\"topic-num\">04<\u002Fspan><div class=\"topic-title\">Perfeccionismo clínico<small>Cuando \"lo mejor\" se vuelve cárcel<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"topic\"><span class=\"topic-num\">05<\u002Fspan><div class=\"topic-title\">Sobreexigencia<small>Procrastinación y autocrítica dura<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"topic\"><span class=\"topic-num\">06<\u002Fspan><div class=\"topic-title\">Trastorno Obsesivo Compulsivo<small>Exposición con prevención de respuesta<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"topic\"><span class=\"topic-num\">07<\u002Fspan><div class=\"topic-title\">Estrés postraumático<small>Sucesos difíciles del pasado<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"topic\"><span class=\"topic-num\">08<\u002Fspan><div class=\"topic-title\">Problemas interpersonales<small>Vínculos, familia, amistades<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n      <div class=\"topic\"><span class=\"topic-num\">09<\u002Fspan><div class=\"topic-title\">Problemas de pareja<small>Comunicación y patrones de apego<\u002Fsmall><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FORMACIÓN -->\n<section class=\"training\" id=\"formacion\" data-screen-label=\"06 Formación\">\n  <div class=\"container\">\n    <div class=\"training-grid\">\n      <div>\n        <div class=\"sec-head\">\n          <span class=\"eyebrow\"><span class=\"mono-label\">Formación<\u002Fspan><\u002Fspan>\n          <h2>Acreditada para <span class=\"em\">cuidarte bien<\u002Fspan>.<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"credentials-card\">\n          <h4>Formación continua, terapia basada en evidencia.<\u002Fh4>\n          <p>Sigo entrenándome cada año porque la psicoterapia evoluciona — y mi compromiso es que tú recibas lo mejor de lo que la evidencia hoy puede ofrecer.<\u002Fp>\n          <div class=\"stat\"><span>Años en consulta<\u002Fspan><span class=\"v\">7+<\u002Fspan><\u002Fdiv>\n          <div class=\"stat\"><span>Personas acompañadas<\u002Fspan><span class=\"v\">350+<\u002Fspan><\u002Fdiv>\n          <div class=\"stat\"><span>Talleres impartidos<\u002Fspan><span class=\"v\">20+<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div class=\"timeline\">\n          <div class=\"timeline-item\">\n            <span class=\"yr\">Pregrado<\u002Fspan>\n            <div class=\"ti\">Licenciatura en Psicología — <span>UAGRM<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"timeline-item\">\n            <span class=\"yr\">Maestría<\u002Fspan>\n            <div class=\"ti\">Maestría en Psicoterapia Integrativa — <span>UAGRM<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"timeline-item\">\n            <span class=\"yr\">Diplomado<\u002Fspan>\n            <div class=\"ti\">Terapias Conductuales y Contextuales — <span>ITECOC<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"timeline-item\">\n            <span class=\"yr\">Entrenamiento<\u002Fspan>\n            <div class=\"ti\">Terapia Integral de Pareja IBCT — <span>UPSA<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"timeline-item\">\n            <span class=\"yr\">Diplomado<\u002Fspan>\n            <div class=\"ti\">Tratamientos basados en la evidencia para Ansiedad y Depresión — <span>TCC Tandil<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"timeline-item\">\n            <span class=\"yr\">Especialización<\u002Fspan>\n            <div class=\"ti\">Análisis Funcional en la práctica clínica — <span>ITECOC<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"timeline-item\">\n            <span class=\"yr\">Curso<\u002Fspan>\n            <div class=\"ti\">Tratamiento de la Rumia — <span>IEPB<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"timeline-item\">\n            <span class=\"yr\">Entrenamiento<\u002Fspan>\n            <div class=\"ti\">Exposición con prevención de respuesta (EPR) para TOC<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"timeline-item\">\n            <span class=\"yr\">Entrenamiento<\u002Fspan>\n            <div class=\"ti\">Habilidades clínicas FAP / ACT — <span>UPSA<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"timeline-item\">\n            <span class=\"yr\">2025<\u002Fspan>\n            <div class=\"ti\">Redacción del motivo de consulta y análisis funcional — <span>APCCP, Perú<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROCESO -->\n<section id=\"proceso\" data-screen-label=\"07 Proceso\">\n  <div class=\"container\">\n    <div class=\"sec-head\">\n      <span class=\"eyebrow\"><span class=\"mono-label\">Cómo trabajamos<\u002Fspan><\u002Fspan>\n      <h2>De la primera consulta al <span class=\"em\">cambio sostenido<\u002Fspan>.<\u002Fh2>\n      <p>Un proceso colaborativo, con objetivos claros y tareas concretas entre sesiones. No vienes a hablar — vienes a practicar.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"process-grid\">\n      <div class=\"step\">\n        <span class=\"n\">01<\u002Fspan>\n        <h4>Escribime<\u002Fh4>\n        <p>Por WhatsApp o el formulario. Coordinamos día, hora y modalidad — online o presencial en Santa Cruz.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"step\">\n        <span class=\"n\">02<\u002Fspan>\n        <h4>Primera sesión<\u002Fh4>\n        <p>Te conozco, escucho qué te trae y juntxs definimos el motivo de consulta y los objetivos del proceso.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"step\">\n        <span class=\"n\">03<\u002Fspan>\n        <h4>Práctica activa<\u002Fh4>\n        <p>Sesiones semanales de 50–75 min con tareas entre encuentros. Te recomiendo traer una libreta para registrar tu proceso.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"step\">\n        <span class=\"n\">04<\u002Fspan>\n        <h4>Cierre y mantenimiento<\u002Fh4>\n        <p>Las sesiones se van espaciando a medida que alcanzas tus objetivos. Aprendes a ser tu propia terapeuta.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section class=\"faq\" id=\"faq\" data-screen-label=\"08 FAQ\">\n  <div class=\"container\">\n    <div class=\"faq-grid\">\n      <div class=\"sec-head\" style=\"margin-bottom:0;\">\n        <span class=\"eyebrow\"><span class=\"mono-label\">Preguntas frecuentes<\u002Fspan><\u002Fspan>\n        <h2>Antes de <span class=\"em\">empezar<\u002Fspan>.<\u002Fh2>\n        <p>Las dudas más comunes que llegan al consultorio. Si la tuya no está, escribime sin compromiso.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"faq-list\" id=\"faqList\">\n        <div class=\"faq-item\">\n          <button class=\"faq-q\">¿Con qué frecuencia son las sesiones?<span class=\"toggle\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"faq-a-inner\">Una vez por semana al inicio. Se van espaciando a medida que avanzamos en los objetivos terapéuticos. Cada sesión dura entre 50 y 75 minutos — llegá a tiempo.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"faq-item\">\n          <button class=\"faq-q\">¿Puedo hacer terapia online?<span class=\"toggle\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"faq-a-inner\">Sí. Atiendo online a personas en cualquier ciudad o país, y presencial en Santa Cruz de la Sierra, Bolivia. La modalidad la definimos en función de lo que más te facilite sostener el proceso.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"faq-item\">\n          <button class=\"faq-q\">¿Cómo agendo mi primera cita?<span class=\"toggle\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"faq-a-inner\">Escribime por WhatsApp al +591 67753318 o llenando el formulario aquí abajo. Te confirmo disponibilidad y coordinamos. Recordá agendar con al menos 1 día de anticipación.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"faq-item\">\n          <button class=\"faq-q\">¿Qué pasa si necesito cancelar?<span class=\"toggle\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"faq-a-inner\">Podés reagendar sin costo avisando con al menos 24 horas de anticipación. Las cancelaciones de último momento se cobran como sesión realizada.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"faq-item\">\n          <button class=\"faq-q\">¿La terapia me va a sentir incómoda?<span class=\"toggle\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"faq-a-inner\">Probablemente sí, en algunos momentos. El proceso implica hacer cosas nuevas o desafiantes para ti — pero te aseguro que valdrá la pena. La incomodidad es señal de que estamos trabajando en el lugar correcto.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"faq-item\">\n          <button class=\"faq-q\">¿Atiendes a adolescentes o solo adultos?<span class=\"toggle\"><\u002Fspan><\u002Fbutton>\n          <div class=\"faq-a\"><div class=\"faq-a-inner\">Atiendo desde los 16 años en adelante. Para menores de edad necesito el consentimiento informado de su madre, padre o tutor legal.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTACT -->\n<section class=\"contact\" id=\"contacto\" data-screen-label=\"09 Contacto\">\n  <div class=\"container\">\n    <div class=\"sec-head\">\n      <span class=\"eyebrow\"><span class=\"mono-label\">Reserva tu sesión<\u002Fspan><\u002Fspan>\n      <h2>Estoy lista para <span class=\"em\">recibirte<\u002Fspan>.<\u002Fh2>\n      <p>Si estás interesadx en tomar terapia conmigo, no dudes en escribirme para agendar tu primera sesión. Estaré muy contenta de conocerte :)<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"contact-grid\">\n      <div class=\"contact-info\">\n        <div>\n          <div class=\"lbl\">WhatsApp<\u002Fdiv>\n          <div class=\"val\"><a href=\"https://wa.me/59167753318\" target=\"_blank\" rel=\"noopener\">+591 67753318\n            <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"lbl\">Email<\u002Fdiv>\n          <div class=\"val\"><a href=\"mailto:psi.gabrielabarrozo@gmail.com\">psi.gabrielabarrozo@gmail.com<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"lbl\">Consultorio<\u002Fdiv>\n          <div class=\"val\">McWork · Barrio Sirari<br>C/Las Begonias #203 · Santa Cruz, Bo<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"lbl\">Horarios<\u002Fdiv>\n          <div class=\"val\">Lun a Vie · 09:00–19:00<br>Sábados con cita previa<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"lbl\">Instagram<\u002Fdiv>\n          <div class=\"val\"><a href=\"https://instagram.com/psi.gabrielabarrozo\" target=\"_blank\" rel=\"noopener\">@psi.gabrielabarrozo<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <form class=\"form\" id=\"contactForm\" novalidate=\"\">\n        <h3>Escríbeme<\u002Fh3>\n        <p class=\"sub\">Te respondo en menos de 24 horas hábiles.<\u002Fp>\n\n        <div class=\"field\" id=\"f-name\">\n          <label for=\"name\">Nombre<\u002Flabel>\n          <input id=\"name\" name=\"name\" type=\"text\" autocomplete=\"name\">\n          <div class=\"err-msg\">Decime cómo te llamas.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\" id=\"f-contact\">\n          <label for=\"contact\">WhatsApp o email<\u002Flabel>\n          <input id=\"contact\" name=\"contact\" type=\"text\" autocomplete=\"tel\" placeholder=\"+591… o tu@mail.com\">\n          <div class=\"err-msg\">Necesito una forma de contactarte.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Tema (elegí uno o más)<\u002Flabel>\n          <div class=\"chips\" id=\"chips\">\n            <button type=\"button\" class=\"chip\" data-chip=\"Ansiedad\">Ansiedad<\u002Fbutton>\n            <button type=\"button\" class=\"chip\" data-chip=\"Pareja\">Pareja<\u002Fbutton>\n            <button type=\"button\" class=\"chip\" data-chip=\"TOC / rumia\">TOC / rumia<\u002Fbutton>\n            <button type=\"button\" class=\"chip\" data-chip=\"Perfeccionismo\">Perfeccionismo<\u002Fbutton>\n            <button type=\"button\" class=\"chip\" data-chip=\"Otro\">Otro<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\" id=\"f-msg\">\n          <label for=\"msg\">Contame brevemente qué te trae<\u002Flabel>\n          <textarea id=\"msg\" name=\"msg\" rows=\"3\" placeholder=\"Lo que necesites compartir, sin presión.\"><\u002Ftextarea>\n          <div class=\"err-msg\">Aunque sea un par de líneas — me ayuda a prepararme.<\u002Fdiv>\n        <\u002Fdiv>\n        <button class=\"btn btn-primary\" type=\"submit\">\n          Enviar mensaje\n          <svg class=\"arrow\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer>\n  <div class=\"container foot\">\n    <div>© 2026 Gabriela Barrozo · Psicóloga Clínica · Reg. Prof. 12345<\u002Fdiv>\n    <div><a href=\"#top\">Volver arriba ↑<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  // Tabs\n  const tabs = document.querySelectorAll('.tab');\n  const panels = document.querySelectorAll('.panel');\n  tabs.forEach(t => t.addEventListener('click', () => {\n    tabs.forEach(x => { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });\n    panels.forEach(p => p.classList.remove('active'));\n    t.classList.add('active'); t.setAttribute('aria-selected', 'true');\n    document.querySelector('.panel[data-panel=\"' + t.dataset.tab + '\"]').classList.add('active');\n  }));\n\n  // FAQ accordion\n  document.querySelectorAll('.faq-q').forEach(q => {\n    q.addEventListener('click', () => {\n      const item = q.parentElement;\n      const a = item.querySelector('.faq-a');\n      const open = item.classList.contains('open');\n      // close others\n      document.querySelectorAll('.faq-item.open').forEach(o => {\n        o.classList.remove('open');\n        o.querySelector('.faq-a').style.maxHeight = '0px';\n      });\n      if (!open) {\n        item.classList.add('open');\n        a.style.maxHeight = a.scrollHeight + 'px';\n      }\n    });\n  });\n\n  // Smooth scroll for anchor links\n  document.querySelectorAll('a[href^=\"#\"]').forEach(a => {\n    a.addEventListener('click', e => {\n      const id = a.getAttribute('href');\n      if (id.length > 1) {\n        const el = document.querySelector(id);\n        if (el) {\n          e.preventDefault();\n          window.scrollTo({ top: el.offsetTop - 60, behavior: 'smooth' });\n        }\n      }\n    });\n  });\n\n  // Chips\n  document.querySelectorAll('#chips .chip').forEach(c => {\n    c.addEventListener('click', () => c.classList.toggle('active'));\n  });\n\n  // Form\n  const form = document.getElementById('contactForm');\n  form.addEventListener('submit', e => {\n    e.preventDefault();\n    let ok = true;\n    const name = document.getElementById('name');\n    const contact = document.getElementById('contact');\n    const msg = document.getElementById('msg');\n    [['f-name', name.value.trim().length >= 2],\n     ['f-contact', contact.value.trim().length >= 4],\n     ['f-msg', msg.value.trim().length >= 4]].forEach(([fid, valid]) => {\n      const f = document.getElementById(fid);\n      f.classList.toggle('error', !valid);\n      if (!valid) ok = false;\n    });\n    if (!ok) return;\n\n    const topics = [...document.querySelectorAll('#chips .chip.active')].map(c => c.dataset.chip).join(', ');\n    const summary = `Nombre: ${name.value}\\nContacto: ${contact.value}\\nTemas: ${topics || '—'}\\nMensaje: ${msg.value}`;\n    console.log('Reserva recibida:\\n' + summary);\n\n    form.innerHTML = `\n      <div class=\"form-success\">\n        <div class=\"ok\">✓<\u002Fdiv>\n        <h4>¡Mensaje enviado!<\u002Fh4>\n        <p>Gracias, ${name.value.split(' ')[0]}. Te respondo en menos de 24 horas hábiles.<\u002Fp>\n      <\u002Fdiv>`;\n  });\n\n  // Subtle parallax on hero flowers\n  const heroFlowers = document.querySelectorAll('.hero-flower');\n  window.addEventListener('scroll', () => {\n    const y = Math.min(window.scrollY, 600);\n    heroFlowers.forEach((el, i) => {\n      el.style.translate = `0 ${y * (i ? 0.2 : 0.12)}px`;\n    });\n  }, { passive: true });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
